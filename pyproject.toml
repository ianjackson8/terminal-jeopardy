[project]
name = "terminal-jeopardy"
version = "0.1.0"
description = "A terminal quiz-show game: play a full game against two AIs, or practice."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jeopardy = "jeopardy.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
jeopardy = ["data/*.json"]
