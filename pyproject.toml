[project]
name = "terminal-trivia"
version = "0.1.0"
description = "A terminal quiz-show game: play a full game against two AIs, or practice."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trivia = "trivia.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
trivia = ["data/*.json"]
